repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
    -   id: check-added-large-files
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace

-   repo: local
    hooks:
    -   id: ruff-check
        name: ruff check
        entry: uv run ruff check src/ tests/ scripts/ alembic/
        language: system
        pass_filenames: false
    -   id: ruff-format-check
        name: ruff format check
        entry: uv run ruff format src/ tests/ scripts/ alembic/ --check
        language: system
        pass_filenames: false
    -   id: mypy
        name: mypy
        entry: uv run mypy src/ --strict
        language: system
        types: [python]
        pass_filenames: false

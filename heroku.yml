# Manifesto do Heroku container stack (ADR-0015).
#
# Uma única imagem serve os três papéis (web, worker e release), evitando builds
# duplicados — o Heroku não faz cache de layers, então cada imagem extra custa
# tempo de deploy.
#
# Ativação: `heroku stack:set container` antes do primeiro `git push heroku`.

build:
  docker:
    web:
      dockerfile: Dockerfile
      # O estágio `runtime` é o último do Dockerfile, mas declaramos explicitamente
      # para que a inclusão de um novo estágio no fim não mude o que vai a produção.
      target: runtime

# Aplica as migrations antes de liberar a nova versão. Se falhar, o Heroku
# aborta o release e mantém a versão anterior no ar (ADR-0008).
release:
  image: web
  command:
    - alembic upgrade head

run:
  # $PORT é definido pelo Heroku; `EXPOSE` do Dockerfile é ignorado.
  web: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
  worker:
    command:
      - saq src.worker.settings.settings
    image: web

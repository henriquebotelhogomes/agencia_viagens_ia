services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # Compose local roda em modo dev (logs legíveis); Render usa production
      - APP_ENV=local
    restart: unless-stopped
    healthcheck:
      # Using Python to check health since curl might not be available in slim image
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  tests:
    profiles:
      - test
    build:
      context: .
      # Estágio com dev deps + tests/ (ver Dockerfile, item S10 do PRD)
      target: test
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      app:
        condition: service_healthy
    command: pytest tests/ -v --cov=src

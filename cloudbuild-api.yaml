steps:
  - name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '--target'
      - 'web'
      - '-t'
      - 'gcr.io/$PROJECT_ID/voyager-api:latest'
      - '.'
images:
  - 'gcr.io/$PROJECT_ID/voyager-api:latest'
options:
  logging: CLOUD_LOGGING_ONLY

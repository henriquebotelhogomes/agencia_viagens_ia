name: CI - Quality & Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    # Testes unitários não usam chaves reais (item S11 do PRD):
    # todos os serviços externos são mockados.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff Check (lint)
        run: uv run ruff check src/ tests/ app.py scripts/ alembic/

      - name: Ruff Format (check style)
        run: uv run ruff format src/ tests/ app.py scripts/ alembic/ --check

      - name: Mypy (strict type checking)
        run: uv run mypy src/ --strict

      - name: Run tests with coverage
        # O gate de cobertura (fail_under=90) está no pyproject.toml
        run: uv run pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml

  frontend:
    name: Frontend (PRD D5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # `ci` respeita o lockfile; `install` poderia atualizar versões
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Testes de unidade e componente
        # O gate de cobertura está em vitest.config.ts
        run: npm run test:cov

      - name: Build de produção
        run: npm run build

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes E2E
        # Sem NEXT_PUBLIC_API_URL, o cliente aponta para localhost:8000, que não
        # existe no CI. Os testes desta suíte não dependem da API.
        run: npx playwright test

      - name: Publicar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docs:
    name: Documentação viva (PRD D13)
    runs-on: ubuntu-latest
    permissions:
      # Necessário para o gh-deploy publicar no branch gh-pages
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (docs + projeto)
        # mkdocstrings importa os módulos para ler os docstrings,
        # portanto precisa do projeto instalado.
        run: uv sync --group docs

      - name: Build docs (strict)
        # --strict falha em link quebrado, referência órfã ou aviso
        run: uv run mkdocs build --strict

      - name: Deploy no GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          uv run mkdocs gh-deploy --force

  docker-check:
    needs: quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Build test image (estágio com dev deps + tests)
        run: docker build --target test -t agencia-viagens-ia:test .

      - name: Run tests inside container
        run: docker run --rm agencia-viagens-ia:test

      - name: Build production image (runtime non-root)
        run: docker build --target runtime -t agencia-viagens-ia .

      - name: Imagem funciona com UID arbitrário (ADR-0015)
        # O Heroku ignora o `USER` do Dockerfile e roda com um UID aleatório e
        # GID 0. Sem um HOME gravável, o CrewAI falha no import ao criar o
        # diretório de storage do ChromaDB — e o worker não sobe em produção.
        run: |
          docker run --rm --user 54321:0 agencia-viagens-ia \
            python -c "import src.worker.tasks; print('import do worker OK com UID arbitrario')"

      - name: Processo web respeita $PORT (ADR-0015)
        # `EXPOSE` é ignorado pela plataforma; se o comando ignorar $PORT, o
        # deploy falha com "R10 Boot timeout".
        run: |
          docker run -d --name web-uid-check --user 54321:0 \
            -e PORT=41234 -e APP_ENV=production -p 41234:41234 \
            agencia-viagens-ia \
            sh -c 'uvicorn src.api.main:app --host 0.0.0.0 --port $PORT'
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:41234/health > /dev/null 2>&1; then
              echo "health respondeu na porta injetada"
              docker rm -f web-uid-check
              exit 0
            fi
            sleep 3
          done
          echo "API nao respondeu na porta $PORT"
          docker logs web-uid-check
          docker rm -f web-uid-check
          exit 1

# Documentação viva do projeto (PRD D13 / §8.5)
# Build local:  uv run mkdocs serve
# Gate no CI:   uv run mkdocs build --strict
site_name: Voyager AI — Documentação Técnica
site_description: >-
  Plataforma de planejamento de viagens com IA multiagente.
  Arquitetura, decisões (ADRs) e referência de API.
site_author: Henrique Botelho Gomes
repo_url: https://github.com/henriquebotelhogomes/agencia_viagens_ia
repo_name: agencia_viagens_ia
edit_uri: edit/master/docs/

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Alternar para tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Alternar para tema claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: pt
  # Referência de API gerada dos docstrings — o que torna a doc "viva" (D13)
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Início: index.md
  - Guias:
      - Setup local: guides/setup.md
      - Contribuição: guides/contributing.md
      - Deploy: guides/deploy.md
  - Arquitetura:
      - Visão geral: architecture/overview.md
      - Contexto (C4 nível 1): architecture/context.md
      - Contêineres (C4 nível 2): architecture/containers.md
      - Fluxo de execução: architecture/execution-flow.md
      - Estratégia de LLM: architecture/llm-strategy.md
  - Decisões (ADR):
      - Índice: adr/index.md
      - ADR-0001 Posicionamento: adr/0001-posicionamento.md
      - ADR-0002 Gateways de LLM: adr/0002-gateways-llm.md
      - ADR-0003 Hospedagem: adr/0003-hospedagem.md
      - ADR-0004 Autenticação: adr/0004-autenticacao.md
      - ADR-0005 Frontend: adr/0005-frontend.md
      - ADR-0006 Backend: adr/0006-backend.md
      - ADR-0007 Fila e worker: adr/0007-fila-worker.md
      - ADR-0008 Persistência: adr/0008-persistencia.md
      - ADR-0009 Mapas: adr/0009-mapas.md
      - ADR-0010 Geocoding: adr/0010-geocoding.md
      - ADR-0011 Busca web: adr/0011-busca-web.md
      - ADR-0012 Observabilidade de LLM: adr/0012-observabilidade-llm.md
      - ADR-0013 Documentação viva: adr/0013-documentacao-viva.md
      - ADR-0014 Fila SAQ: adr/0014-fila-saq.md
      - ADR-0015 Hospedagem Heroku: adr/0015-hospedagem-heroku.md
      - ADR-0016 Internacionalização: adr/0016-i18n.md
      - ADR-0017 Versionamento de roteiro: adr/0017-versionamento-roteiro.md
  - Operação:
      - Deploy: operations/deploy.md
      - Observabilidade: operations/observability.md
      - FinOps: operations/finops.md
      - Runbook: operations/runbook.md
  - Referência de API:
      - Configuração: reference/config.md
      - Runtime: reference/runtime.md
      - Frontend: reference/frontend.md
      - Testes: reference/testing.md
      - API HTTP: reference/api.md
      - Persistência e worker: reference/persistence.md
      - Agentes e tarefas: reference/agents.md
      - Serviços: reference/services.md
      - Utilitários: reference/utils.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/henriquebotelhogomes/agencia_viagens_ia
      name: Repositório no GitHub

# Falha o build em link quebrado ou referência órfã (gate do CI)
strict: true
